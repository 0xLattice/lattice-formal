name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - MCMain.cfg
          - MCGap.cfg
          - MCTie.cfg
          - MCHierarchy_Main.cfg
          - MCHierarchy_ParentBad.cfg
          - MCHierarchy_P1Gap.cfg
          - MCHierarchy_HeldInvalid.cfg
          - MCHierarchy_HeaderBad.cfg
          - MCHierarchy3_Main.cfg
          - MCHierarchyFork_Main.cfg
          - MCSwapReorg_Main.cfg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Model-check ${{ matrix.config }}
        run: |
          scripts/tlc.sh ${{ matrix.config }} | tee tlc.log
          grep -q "No error has been found" tlc.log

  mutants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Witnesses are reachable (properties are not vacuous)
        run: |
          scripts/tlc.sh MCHierarchyFork_W.cfg | tee w.log || true
          grep -q "Invariant NoBackedFork is violated" w.log
          scripts/tlc.sh MCHierarchyFork_WG.cfg | tee wg.log || true
          grep -q "Invariant NoBackedGrandchildFork is violated" wg.log
          for pair in "WParentReorg NaiveCanonicalBacking" "WChildReorg PaidImpliesReleased" \
                      "WTwoBranches ReleasedOnOneBranch" "WRedeem NoRedeemAfterReorg" \
                      "WDemanderSafe NoSafeReleaseBesideParentFork"; do
            set -- $pair
            scripts/tlc.sh MCSwapReorg_$1.cfg | tee sw.log || true
            grep -q "Invariant $2 is violated" sw.log
          done
      - name: Planted bugs must be caught
        run: python3 scripts/mutants.py

  traces:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: The trace checker catches corrupted traces
        run: python3 scripts/trace_check.py --selftest traces/lattice-53.2.0/trace-2.json
      - name: Implementation traces conform to the spec
        run: python3 scripts/trace_check.py traces/lattice-53.2.0
      - name: The hierarchy trace checker catches corrupted traces
        run: python3 scripts/hierarchy_trace_check.py --selftest traces/hierarchy-434a3be/trace-2.json
      - name: Two-level implementation traces conform to the spec
        run: python3 scripts/hierarchy_trace_check.py traces/hierarchy-434a3be
      - name: The hierarchy trace checker catches corrupted three-level traces
        run: python3 scripts/hierarchy_trace_check.py --selftest traces/hierarchy3-8c60c39/trace-10.json
      - name: Three-level implementation traces with header-rule exclusions conform to the spec
        run: python3 scripts/hierarchy_trace_check.py traces/hierarchy3-8c60c39

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Proofs build with no sorry and only standard axioms
        working-directory: lean
        run: |
          lake build
          ! grep -n -E '\bsorry\b|\badmit\b|^axiom|native_decide|implemented_by' LatticeProofs/*.lean
          lake env lean LatticeProofs/Axioms.lean | tee axioms.txt
          ! grep -v -E "depends on axioms: \[(propext|Classical.choice|Quot.sound)(, (propext|Classical.choice|Quot.sound))*\]" axioms.txt
      - name: Implementation value traces conform to the model
        working-directory: lean
        run: |
          lake build tracecheck
          .lake/build/bin/tracecheck ../traces/value-2dfbab1/*.json ../traces/value-width-38bef1e/*.json
      - name: Planted bugs break the proofs or the traces
        run: python3 scripts/lean_mutants.py traces/value-2dfbab1 traces/value-width-38bef1e
