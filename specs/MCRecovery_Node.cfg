\* The implementation's replay: ChainTree.replay's sort order, with no
\* revision floor (ChainTree.restore given none, as lattice-node did before
\* adalinxx/lattice-node#22; it now passes the durable batch count, which is
\* at least Main's rev + 1 at Stage). RevisionMonotone fails here: see
\* MCRecovery_RevisionProbe.cfg.
SPECIFICATION Spec
CONSTANTS
    None = "none"
    Blocks <- MCBlocks
    Parent <- MCParent
    CidRank <- MCCidRank
    Grinds <- MCGrinds
    Batches <- MCBatches
    Genesis <- MCGen
    Rebuild <- MCRebuild
    MaxLog = 5
    MaxCrashes = 2
    FloorPersisted = FALSE
    SortedReplay = TRUE
INVARIANTS TypeOK RecoveredEqualsLive VisibleImpliesDurable ReplayIdempotent ConflictRejected
PROPERTIES RevisionAdvances FailureLeavesGraphUnchanged StagedBecomesVisible
